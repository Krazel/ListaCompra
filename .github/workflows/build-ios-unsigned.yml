name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: native-ios
        run: xcodegen generate
      - name: Build app
        working-directory: native-ios
        run: |
          xcodebuild -project ListaCompra.xcodeproj -scheme ListaCompra -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        working-directory: native-ios
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/ListaCompra.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No se encontro ListaCompra.app"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" || true)
          if [ "$BUNDLE_ID" != "com.dmkr.listacompra" ]; then
            echo "CFBundleIdentifier invalido o ausente: $BUNDLE_ID"
            /usr/libexec/PlistBuddy -c "Print" "$APP_PATH/Info.plist" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ListaCompra-iPhone-v1.1-build-${{ github.run_number }}.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ListaCompra-iPhone-v1.1-build-${{ github.run_number }}
          path: native-ios/ListaCompra-iPhone-v1.1-build-${{ github.run_number }}.ipa
